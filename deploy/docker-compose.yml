# Konteyner yolu için: docker compose -f deploy/docker-compose.yml up -d --build
#
# Uygulama 8080 portunda yayınlanır. HTTPS'i önüne koyacağınız ters vekil
# üstlenir; PWA'nın telefona kurulabilmesi için HTTPS zorunludur.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: muay-thai:latest
    container_name: muay-thai
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    # Sadece statik dosya sunuyor; yazılabilir alana ihtiyacı yok.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
