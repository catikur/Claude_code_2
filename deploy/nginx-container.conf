# Konteyner içindeki nginx. TLS ve alan adı burada yok; onları önündeki
# ters vekil üstlenir. Önbellek kuralları deploy/nginx.conf ile aynı mantıkta.
#
# Güvenlik başlıkları her location'da tekrar ediyor: nginx'te bir location kendi
# add_header'ını tanımlayınca üst bloktan gelenleri devralmaz.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/muay-thai-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location /assets/ {
        include /etc/nginx/snippets/muay-thai-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/muay-thai-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /sw.js {
        include /etc/nginx/snippets/muay-thai-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/muay-thai-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
