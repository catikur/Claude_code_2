# Güvenlik başlıkları — /etc/nginx/snippets/muay-thai-headers.conf olarak kurulur.
#
# Neden ayrı dosya: nginx'te bir `location` bloğu kendi `add_header` satırını
# içerirse ÜST bloktan gelen başlıkların HİÇBİRİNİ devralmaz. Önbellek kuralları
# için location başına add_header kullandığımızdan, güvenlik başlıklarını da her
# birinde tekrar etmek gerekiyor. Tek yerde tutup include etmek, birinde unutma
# riskini ortadan kaldırır.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Uygulama tamamen kendi kendine yeter: dış istek yok, veri cihazda durur.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
