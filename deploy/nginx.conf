# Muay Thai Program — nginx sunucu bloğu
#
# Kurulum (iki dosya):
#   sudo cp deploy/nginx-headers.conf /etc/nginx/snippets/muay-thai-headers.conf
#   sudo cp deploy/nginx.conf         /etc/nginx/sites-available/muay-thai
#   sudo ln -s /etc/nginx/sites-available/muay-thai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Aşağıdaki example.com yerine kendi alan adınızı yazın.
# HTTPS'i certbot ekler (bkz. deploy/README.md) — bu dosyayı kendisi düzenler.
#
# NOT: Her location bloğu güvenlik başlıklarını yeniden include ediyor. Bu
# tekrar bilinçli: nginx'te bir location kendi add_header'ını tanımladığı anda
# üst bloktan gelen başlıkları devralmaz.

server {
    listen 80;
    listen [::]:80;

    server_name example.com www.example.com;

    root /var/www/muay-thai/current;
    index index.html;

    include /etc/nginx/snippets/muay-thai-headers.conf;

    # ---- Sıkıştırma ----
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---- Önbellek ----
    # Vite çıktısındaki dosya adları içerik özetini taşır (index-a1b2c3.js);
    # bu yüzden sonsuza kadar önbelleklenebilirler.
    location /assets/ {
        include /etc/nginx/snippets/muay-thai-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Bu üçü ASLA önbelleklenmemeli: yeni sürümün kullanıcıya ulaşması
    # bunların taze okunmasına bağlı.
    location = /index.html {
        include /etc/nginx/snippets/muay-thai-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /sw.js {
        include /etc/nginx/snippets/muay-thai-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/muay-thai-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        default_type application/manifest+json;
    }

    location ~* \.(png|svg|ico|woff2)$ {
        include /etc/nginx/snippets/muay-thai-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # Tek sayfalık uygulama: bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gizli dosyalara erişimi kes.
    location ~ /\. {
        deny all;
    }
}
